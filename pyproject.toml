[project]
name = "nova-navigator"
version = "0.1.0"
description = "Terminal file manager with two panels, a text editor and local, SSH, archive and Azure Blob file systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/nova_editor/LICENSE.textual"]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "pyte>=0.8.2",
    "textual[syntax]>=8.2",
    "tomlkit>=0.13.3",
    "watchdog>=6.0.0",
    "paramiko>=4.0.0",
    "pygments>=2.19.2",
    "rich>=14.2.0",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.27.1", "azure-identity>=1.25.1"]

[project.urls]
Homepage = "https://github.com/epicodic/nova-navigator"
Repository = "https://github.com/epicodic/nova-navigator"
Issues = "https://github.com/epicodic/nova-navigator/issues"

[project.scripts]
nn = "nova_navigator.main:main"
ned = "nova_editor.app:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nova_navigator", "nova_editor", "nova_widgets"]

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "hypothesis>=6.168.3",
    "nova-navigator-devtools",
    "nova-navigator[azure]",
    "nuitka>=2.8.9",
    "pre-commit>=4.3.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.0",
    "textual-dev>=1.8.0",
    "ty>=0.0.26",
    "types-paramiko>=4.0.0.20250822",
]

#######################################
# uv 
[tool.uv]
default-groups = ["dev"]
package = true

[tool.uv.sources]
nova-navigator-devtools = { path = "devtools", editable = true }

#######################################
# ruff 
[tool.ruff]
cache-dir = ".cache/ruff"
indent-width = 4
line-length = 200
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["ALL"]

mccabe.max-complexity = 18

ignore = [

    #eradicate (ERA) 
    "ERA001", # commented-out code

    # flake8 
    "DTZ", # datetimez
    "EM",  # errmsg
    "FIX", # fixme
    "PTH", # use-pathlib
    "SLF", # self
    "T20", # print
    "TD",  # todos

    # flake8-annotations (ANN) 
    "ANN204", # Missing return type annotation for special method `__init__
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed"

    "A002",
    "ARG002", # Unused argument
    "FBT001",
    "FBT002",
    "FBT003",
    "TID252",
    "TC001",  # Move local import into a type-checking block
    "TC002",  # Move third-party import into a type-checking block

    # flake8-commas (COM)
    "COM812", # Missing trailing comma 

    # flake8-simplify (SIM)
    "SIM108", # Use ternary operator instead of if-else-block

    # flake8-type-checking (TC)
    "TC003", # Move standard library import into a type-checking block


    # pep8-naming (N)
    "N802", # function name should be lowercase
    "N803", # argument name should be lowercase
    "N806", # variable in function should be lowercase
    "N818", # Error suffix of exceptions

    # pydocstyle (D) 
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in `__init__`

    # pygrep-hooks (PGH) 
    "PGH",

    "RET504", # Unnecessary assignment 
    "RET505", # Unnecessary else after return

    # pylint (PL)
    "PLR0913", # Too many arguments in function definition
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR5501",

    "S101", # Use of assert detected.
    "S301", # Pickle usage
    "S603", # Starting a process
    "S606", # Starting a process with a shell
    "S607", #  ...

    # tryceratops (TRY)
    "TRY",
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "ANN201",  # Missing return type annotation for public function
    "D",       # ignore all pydocstyle errors
    "INP001",  # Missing __init__.py 
    "PLC0415", # import not at top-level (used for monkeypatching in tests)
    "PLR2004", # Magic value used in comparison
]
"debug.py" = ["T100"] # explicitly allow pydebug
# Vendored from Textual 8.2.8 (MIT license); minor style differences accepted
"src/nova_editor/widget/_text_area.py" = ["D205", "D301", "D415", "C901", "SIM103", "D417", "SIM102", "PLR0915", "ANN202", "ARG001", "RSE102", "PLR2004", "W291", "W293"]
"src/nova_editor/widget/_text_area_theme.py" = ["D205", "D301", "D415", "D417", "SIM102", "W291", "W293"]
"src/nova_editor/document/_document.py" = ["D205", "D301", "D415", "D417", "SIM102", "W291", "W293"]
"src/nova_editor/document/_document_navigator.py" = ["D205", "D301", "D415", "SIM103", "SIM102", "W291", "W293"]
"src/nova_editor/document/_edit.py" = ["D205", "D301", "D415", "D417", "W291", "W293"]
"src/nova_editor/document/_wrapped_document.py" = ["D205", "D301", "D415", "SIM102", "W291", "W293"]
"src/nova_editor/document/_syntax_aware_document.py" = ["D205", "D301", "D415", "ANN202", "W291", "W293", "D417", "SIM102"]
"src/nova_editor/document/_history.py" = ["D205", "D301", "D415", "W291", "W293"]
"src/nova_navigator/usermenu/evaluate.py" = [
    "S307", # eval() of user menu conditions is the feature; the config file is trusted user input
]

[tool.ruff.lint.pydocstyle]
convention = "google"

#######################################
# pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
cache_dir = ".cache/pytest"
asyncio_mode = "strict"
timeout = 120
timeout_method = "thread"
markers = [
    "integration: full-stack tests that launch a real NovaNavigator app and use the real local filesystem",
    "ssh: integration tests that require a running stub SSH server (subset of integration)",
    "wall_clock: asserts an elapsed-time budget; run without parallel load",
]

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/.venv/*", "*/site-packages/*", "setup.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

#######################################
# ty
[tool.ty.src]
include = ["src", "tests"]
exclude = ["src/nova_navigator/widgets/terminal.py"]
