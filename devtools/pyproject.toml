# Development commands for a source checkout; never built or published.
# The command code lives in ../src/tools, importable through the root project's editable install.
[project]
name = "nova-navigator-devtools"
version = "0"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
qa = "tools.qa:main"
dialog_tester = "tools.dialog_tester:main"
widget_tester = "tools.widget_tester:main"
local_copy_probe = "tools.local_copy_probe:main"
gen_reference_files = "tools.gen_reference_files:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"
