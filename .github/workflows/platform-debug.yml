name: Platform Debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system for the debug runner
        required: true
        type: choice
        options:
          - windows-latest
          - macos-latest
      ref:
        description: Nova Navigator branch, tag, or commit SHA to check out
        required: true
        default: main
        type: string
permissions: {}

jobs:
  debug:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - name: Check out Nova Navigator
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --all-groups
      - name: Open browser terminal on Windows
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.win32.exe `
            -OutFile "$env:RUNNER_TEMP/ttyd.exe"
          Invoke-WebRequest `
            -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
            -OutFile "$env:RUNNER_TEMP/cloudflared.exe"
          Start-Process `
            -FilePath "$env:RUNNER_TEMP/ttyd.exe" `
            -ArgumentList @('-W', '-p', '7681', 'powershell.exe')
          & "$env:RUNNER_TEMP/cloudflared.exe" tunnel --url http://127.0.0.1:7681 --protocol http2
      - name: Open browser terminal on macOS
        if: inputs.os == 'macos-latest'
        run: |
          brew install cloudflared ttyd
          ttyd -W -p 7681 zsh &
          cloudflared tunnel --url http://127.0.0.1:7681 --protocol http2
