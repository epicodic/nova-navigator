name: Platform Debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: Operating system for the debug runner
        required: true
        type: choice
        options:
          - windows-latest
          - macos-latest
      ref:
        description: Nova Navigator branch, tag, or commit SHA to check out
        required: true
        default: main
        type: string

permissions: {}

jobs:
  debug:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - name: Check out Nova Navigator
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --all-groups
      - name: Open tmate debug session on ${{ inputs.os }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          connect-timeout-seconds: 1800
